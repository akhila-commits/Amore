<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Revello Speciality Logo (from PDF Page 1) -->
  <defs>
    <linearGradient id="revelloGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8BE54"/>
      <stop offset="50%" stop-color="#FBE597"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#321610" rx="16"/>

  <g transform="translate(250, 90)">
    <!-- "Revello" in high-elegance serif -->
    <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', serif" font-weight="600" font-size="70" fill="url(#revelloGold)" letter-spacing="1.5">
      Revello
    </text>

    <!-- Characteristic Gold Swash Underneath "Revello" (PDF p. 1) -->
    <path d="M-105,8 Q-40,32 0,16 Q45,0 95,16" fill="none" stroke="url(#revelloGold)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- "SPECIALITY" tracked serif -->
    <text x="0" y="48" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="500" font-size="28" fill="url(#revelloGold)" letter-spacing="14">
      SPECIALITY
    </text>

    <!-- Horizontal Underline Baseline (PDF p. 1) -->
    <line x1="-180" y1="62" x2="180" y2="62" stroke="url(#revelloGold)" stroke-width="2.2"/>
  </g>
</svg>
