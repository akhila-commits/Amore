<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Sama Dream Cakes by Amore (from PDF Page 3 & 5) -->
  <defs>
    <linearGradient id="samaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997010"/>
    </linearGradient>
    <radialGradient id="pinkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </radialGradient>
  </defs>

  <!-- Pink scalloped backdrop badge -->
  <circle cx="250" cy="250" r="230" fill="url(#pinkBg)" stroke="url(#samaGold)" stroke-width="6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#F48FB1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Floral sprays top-right -->
  <g transform="translate(320, 140)">
    <circle cx="20" cy="-20" r="4" fill="url(#samaGold)"/>
    <circle cx="35" cy="-5" r="3.5" fill="url(#samaGold)"/>
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="1"/>
    <ellipse cx="14" cy="14" rx="14" ry="20" fill="#FFEBEE" stroke="#F8BBD0" stroke-width="1" transform="rotate(45 14 14)"/>
    <circle cx="6" cy="6" r="5" fill="#D4AF37"/>
  </g>

  <!-- Royal Crown on top of 'S' -->
  <g transform="translate(145, 115) scale(0.85)">
    <path d="M0,25 L10,5 L25,18 L40,0 L55,18 L70,5 L80,25 Z" fill="url(#samaGold)" stroke="#997010" stroke-width="1.5"/>
    <circle cx="40" cy="18" r="3" fill="#E91E63"/>
    <circle cx="10" cy="5" r="2.5" fill="url(#samaGold)"/>
    <circle cx="40" cy="0" r="3" fill="url(#samaGold)"/>
    <circle cx="70" cy="5" r="2.5" fill="url(#samaGold)"/>
    <rect x="0" y="25" width="80" height="7" rx="3.5" fill="url(#samaGold)"/>
  </g>

  <!-- "Sama" large text -->
  <text x="250" y="235" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="88" fill="url(#samaGold)" letter-spacing="1">
    Sama
  </text>

  <!-- "Dream Cakes" -->
  <text x="250" y="295" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="44" fill="url(#samaGold)" letter-spacing="3">
    DREAM CAKES
  </text>

  <!-- Heart divider -->
  <g transform="translate(250, 318)">
    <line x1="-90" y1="0" x2="-20" y2="0" stroke="url(#samaGold)" stroke-width="1.5"/>
    <path d="M0,-6 C0,-10 -6,-14 -9,-9 C-12,-14 -18,-10 -18,-6 C-18,0 -9,4 -9,4 C-9,4 0,0 0,-6 Z" fill="#E91E63" transform="translate(9, 3) scale(0.8)"/>
    <line x1="20" y1="0" x2="90" y2="0" stroke="url(#samaGold)" stroke-width="1.5"/>
  </g>

  <!-- "by Amore" -->
  <text x="250" y="365" text-anchor="middle" font-family="'Playfair Display', cursive, serif" font-style="italic" font-weight="600" font-size="42" fill="url(#samaGold)">
    by Amore
  </text>

  <!-- Bottom green/gold sprigs -->
  <g transform="translate(250, 410)">
    <path d="M-80,0 Q-40,20 0,20 Q40,20 80,0" fill="none" stroke="url(#samaGold)" stroke-width="2"/>
    <circle cx="0" cy="20" r="3" fill="url(#samaGold)"/>
  </g>
</svg>
