<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- MARK-TECH Official Circular Production Seal -->
  <defs>
    <linearGradient id="sealRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1F44"/>
    </linearGradient>
    <linearGradient id="sealBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38"/>
      <stop offset="100%" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="mtBlueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="mtFacetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring and Seal Rim -->
  <circle cx="100" cy="100" r="96" fill="url(#sealBgGrad)" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#sealRingGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="84" fill="#0B1F44" fill-opacity="0.6" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Curved Text Path -->
  <path id="textCircleTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <path id="textCircleBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>

  <text font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#93C5FD">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      OFFICIAL PRODUCTION SEAL
    </textPath>
  </text>

  <text font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.8" fill="#94A3B8">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      MARK-TECH · DIGITAL AGENCY
    </textPath>
  </text>

  <!-- Side Stars / Accents -->
  <circle cx="28" cy="100" r="2.5" fill="#3B82F6"/>
  <circle cx="172" cy="100" r="2.5" fill="#3B82F6"/>

  <!-- Centered MT Icon Symbol -->
  <g transform="translate(62, 58) scale(0.95)">
    <!-- Left Pillar (M - White) -->
    <path d="M 6 24 L 20 24 L 20 74 L 6 74 Z" fill="#FFFFFF"/>
    
    <!-- Downward Diagonal Fold (M - Cool Grey Shading) -->
    <path d="M 20 24 L 38 46 L 38 60 L 20 38 Z" fill="url(#mtFacetGrad2)"/>
    
    <!-- Upward Diagonal Fold (M - White) -->
    <path d="M 38 46 L 54 26 L 54 40 L 38 60 Z" fill="#FFFFFF"/>
    
    <!-- Slanted Crossbar (T - Electric Blue) -->
    <path d="M 34 32 L 76 10 L 76 22 L 34 44 Z" fill="url(#mtBlueGrad2)"/>
    
    <!-- Right Pillar (T Stem - Electric Blue) -->
    <path d="M 58 24 L 72 17 L 72 74 L 58 74 Z" fill="#2563EB"/>
  </g>

  <!-- Bottom Verification Check Badge -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="8" fill="#2563EB"/>
    <path d="M -3.5 0 L -1 2.5 L 3.5 -2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
