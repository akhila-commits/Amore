    <path d="M 125 315 
             C 105 335 75 345 55 330 
             C 42 320 45 300 62 290 
             C 75 282 92 290 88 305 
             C 85 315 75 318 68 312 
             C 65 308 68 300 75 298 
             C 80 298 82 305 78 308 
             C 76 310 74 308 75 305 Z" 
