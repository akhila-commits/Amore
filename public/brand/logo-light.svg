    <path d="M 248 340 
             C 290 350 350 352 420 342 
             C 455 337 485 325 500 310 
             C 505 305 510 310 505 315 
             C 485 335 450 348 415 352 
             C 345 362 285 358 248 340 Z" 
          fill="url(#goldLightMetallic)"/>

    <g transform="translate(252, 240)">
      <path d="M 5 65 L 18 20 C 22 8 32 5 42 12 C 50 18 52 28 48 40 L 40 65 L 28 65 L 36 38 C 38 30 35 24 28 20 C 22 18 16 22 14 30 L 2 65 Z" fill="url(#goldLightMetallic)"/>
      <path d="M 38 38 C 45 22 55 12 68 12 C 78 12 85 20 82 32 L 72 65 L 60 65 L 70 34 C 72 26 68 20 60 20 C 52 20 46 26 44 35 L 34 65 L 24 65 Z" fill="url(#goldLightMetallic)"/>
      <path d="M 70 34 C 78 20 88 12 100 12 C 112 12 118 20 115 34 L 105 65 C 104 68 108 72 114 68 C 120 64 125 58 128 52 L 130 55 C 125 64 116 75 105 75 C 95 75 92 68 94 58 L 102 32 C 104 25 100 20 92 20 C 85 20 78 25 76 35 Z" fill="url(#goldLightMetallic)"/>
    </g>

    <g transform="translate(378, 240)">
      <path d="M 35 12 
               C 58 12 72 28 68 50 
               C 64 72 45 88 22 88 
               C -2 88 -14 70 -10 48 
               C -6 26 12 12 35 12 Z 
               M 32 24 
               C 18 24 6 36 3 50 
               C 0 64 12 76 25 76 
               C 40 76 52 64 55 48 
               C 58 34 46 24 32 24 Z" 
            fill="url(#goldLightMetallic)"/>

      <path d="M 29 38 
               C 29 30 20 26 15 32 
               C 10 26 1 30 1 38 
               C 1 48 15 60 15 60 
               C 15 60 29 48 29 38 Z" 
            fill="url(#heartLightGlow)" stroke="#FFFCE6" stroke-width="0.8"/>
    </g>

    <g transform="translate(450, 248)">
      <path d="M 8 57 L 22 8 C 24 2 28 0 32 0 C 35 0 36 4 33 12 L 25 35 C 32 22 42 12 52 10 C 60 8 66 12 65 18 C 64 24 58 26 52 24 C 42 22 32 30 26 44 L 18 68 L 5 68 L 8 57 Z" fill="url(#goldLightMetallic)"/>
      <circle cx="58" cy="16" r="3.5" fill="url(#goldLightMetallic)"/>
    </g>

    <g transform="translate(505, 248)">
      <path d="M 28 8 
               C 45 8 58 20 54 38 
               L 8 45 
               C 8 58 18 68 32 68 
               C 42 68 50 62 55 54 
               L 62 58 
               C 55 70 42 78 28 78 
               C 8 78 -5 62 -2 42 
               C 2 22 15 8 28 8 Z 
               M 26 18 
               C 16 18 10 26 9 37 
               L 42 33 
               C 44 24 36 18 26 18 Z" 
            fill="url(#goldLightMetallic)"/>
    </g>
  </g>

  <!-- Center Divider: Heart & Flourish Lines -->
  <g id="dividerLight">
    <path d="M 120 372 C 170 371 225 372 278 372 C 278 373.8 225 374.8 170 373.8 Z" fill="url(#goldLightMetallic)"/>
    <path d="M 300 362 
             C 300 354 290 350 284 357 
             C 278 350 268 354 268 362 
             C 268 374 284 384 284 384 
             C 284 384 300 374 300 362 Z" 
          fill="url(#heartLightGlow)" stroke="#FFFDF0" stroke-width="0.8" transform="translate(16, -2) scale(0.9)"/>
    <path d="M 322 372 C 375 372 430 371 480 372 C 480 373.8 430 374.8 375 373.8 Z" fill="url(#goldLightMetallic)"/>
  </g>

  <!-- Tagline: Title Case Serif Typography -->
  <text x="300" y="415" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', 'Baskerville', 'Georgia', serif" 
        font-weight="600" 
        font-size="22" 
        fill="url(#goldLightMetallic)" 
        letter-spacing="0.5">
    Celebrating Life’s Little Moments
  </text>

  <!-- Bottom Botanical Laurel -->
  <g id="bottomLaurelLight">
    <path d="M 170 445 Q 300 535 430 445" fill="none" stroke="url(#goldLightMetallic)" stroke-width="2.6" stroke-linecap="round"/>
    <g id="leftBottomLeavesLight">
      <path d="M 200 458 C 175 460 160 480 175 495 C 195 490 205 475 200 458 Z" fill="url(#leafLightDeep)"/>
      <path d="M 200 458 Q 185 480 175 495" stroke="url(#goldLightMetallic)" stroke-width="0.9" fill="none"/>
      <path d="M 235 480 C 215 490 210 515 228 525 C 245 515 248 495 235 480 Z" fill="url(#leafLightMid)"/>
      <path d="M 235 480 Q 225 505 228 525" stroke="url(#goldLightMetallic)" stroke-width="0.9" fill="none"/>
    </g>
    <g id="rightBottomLeavesLight">
      <path d="M 400 458 C 425 460 440 480 425 495 C 405 490 395 475 400 458 Z" fill="url(#leafLightDeep)"/>
      <path d="M 400 458 Q 415 480 425 495" stroke="url(#goldLightMetallic)" stroke-width="0.9" fill="none"/>
      <path d="M 365 480 C 385 490 390 515 372 525 C 355 515 352 495 365 480 Z" fill="url(#leafLightMid)"/>
      <path d="M 365 480 Q 375 505 372 525" stroke="url(#goldLightMetallic)" stroke-width="0.9" fill="none"/>
    </g>
    <path d="M 270 502 C 285 485 315 485 330 502 C 315 528 285 528 270 502 Z" fill="url(#leafLightGold)"/>
    <path d="M 270 502 Q 300 495 330 502" stroke="#FFF5BE" stroke-width="1.1" fill="none"/>
  </g>

</svg>