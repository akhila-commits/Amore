<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Light / Transparent variant for Header, Mobile Nav & Footer -->
  <defs>
    <linearGradient id="goldLightMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D1"/>
      <stop offset="18%" stop-color="#F7DE85"/>
      <stop offset="35%" stop-color="#DEB03D"/>
      <stop offset="50%" stop-color="#FFF0B0"/>
      <stop offset="68%" stop-color="#C79624"/>
      <stop offset="85%" stop-color="#8F640C"/>
      <stop offset="100%" stop-color="#FDE89C"/>
    </linearGradient>

    <radialGradient id="heartLightGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFEE6"/>
      <stop offset="45%" stop-color="#FBE07A"/>
      <stop offset="80%" stop-color="#D4A228"/>
      <stop offset="100%" stop-color="#8C6207"/>
    </radialGradient>

    <linearGradient id="leafLightDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A665"/>
      <stop offset="50%" stop-color="#2D6B3C"/>
      <stop offset="100%" stop-color="#143E1F"/>
    </linearGradient>
    <linearGradient id="leafLightMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DC47E"/>
      <stop offset="50%" stop-color="#3A824C"/>
      <stop offset="100%" stop-color="#1A4A25"/>
    </linearGradient>
    <linearGradient id="leafLightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5BE"/>
      <stop offset="50%" stop-color="#E5B545"/>
      <stop offset="100%" stop-color="#94650D"/>
    </linearGradient>

    <linearGradient id="petalLightFront" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFDF7"/>
      <stop offset="90%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#E5D6C3"/>
    </linearGradient>
    <linearGradient id="petalLightBack" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F3E9DA"/>
      <stop offset="100%" stop-color="#D8C7B0"/>
    </linearGradient>

    <filter id="lightDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Black Core for High Contrast Badge Display -->
  <circle cx="300" cy="300" r="286" fill="#050505"/>

  <!-- Outer Double Rings -->
  <circle cx="300" cy="300" r="274" fill="none" stroke="url(#goldLightMetallic)" stroke-width="6.5"/>
  <circle cx="300" cy="300" r="264" fill="none" stroke="url(#goldLightMetallic)" stroke-width="2.2"/>

  <!-- Botanical Magnolia Top-Right -->
  <g id="topRightBotanicalLight">
    <!-- Golden Berry Sprigs -->
    <g stroke="url(#goldLightMetallic)" fill="none" stroke-linecap="round">
      <path d="M 390 170 Q 365 140 355 125" stroke-width="1.8"/>
      <path d="M 368 144 Q 355 142 342 148" stroke-width="1.4"/>
      <path d="M 382 155 Q 360 165 348 180" stroke-width="1.4"/>
      <circle cx="355" cy="125" r="5" fill="url(#goldLightMetallic)" stroke="none"/>
      <circle cx="342" cy="148" r="4.2" fill="url(#goldLightMetallic)" stroke="none"/>
      <circle cx="348" cy="180" r="4.6" fill="url(#goldLightMetallic)" stroke="none"/>

      <path d="M 440 145 Q 470 120 492 110" stroke-width="1.8"/>
      <path d="M 465 130 Q 485 135 500 148" stroke-width="1.4"/>
      <path d="M 470 148 Q 482 170 488 185" stroke-width="1.4"/>
      <circle cx="492" cy="110" r="5.2" fill="url(#goldLightMetallic)" stroke="none"/>
      <circle cx="500" cy="148" r="4.4" fill="url(#goldLightMetallic)" stroke="none"/>
      <circle cx="488" cy="185" r="4.8" fill="url(#goldLightMetallic)" stroke="none"/>
    </g>

    <!-- Deep Green Leaves -->
    <g>
      <path d="M 380 170 C 350 145 340 115 375 95 C 410 115 405 145 380 170 Z" fill="url(#leafLightDeep)"/>
      <path d="M 380 170 Q 370 135 375 95" stroke="url(#goldLightMetallic)" stroke-width="1.2" fill="none"/>
      <path d="M 415 160 C 405 120 420 80 440 75 C 460 95 450 135 415 160 Z" fill="url(#leafLightMid)"/>
      <path d="M 415 160 Q 430 115 440 75" stroke="url(#goldLightMetallic)" stroke-width="1.2" fill="none"/>
      <path d="M 450 185 C 485 165 525 170 540 195 C 515 220 475 210 450 185 Z" fill="url(#leafLightDeep)"/>
      <path d="M 450 185 Q 495 190 540 195" stroke="url(#goldLightMetallic)" stroke-width="1.2" fill="none"/>
      <path d="M 440 220 C 465 240 480 270 500 275 C 485 295 450 280 435 250 Z" fill="url(#leafLightGold)"/>
      <path d="M 440 220 Q 465 255 500 275" stroke="#FFF5BE" stroke-width="1.2" fill="none"/>
      <path d="M 350 200 C 315 195 290 175 305 155 C 335 165 350 185 350 200 Z" fill="url(#leafLightMid)"/>
      <path d="M 350 200 Q 320 180 305 155" stroke="url(#goldLightMetallic)" stroke-width="1.1" fill="none"/>
    </g>

    <!-- Magnolia Flower -->
    <g transform="translate(435, 190)">
      <path d="M 0 0 C -45 -55 -20 -95 15 -85 C 45 -70 25 -30 0 0 Z" fill="url(#petalLightBack)" stroke="#E8DAC7" stroke-width="0.8"/>
      <path d="M 0 0 C 35 -60 80 -60 85 -20 C 70 15 35 15 0 0 Z" fill="url(#petalLightBack)" stroke="#E8DAC7" stroke-width="0.8"/>
      <path d="M 0 0 C 40 10 75 45 50 75 C 20 80 5 45 0 0 Z" fill="url(#petalLightBack)" stroke="#E8DAC7" stroke-width="0.8"/>
      <path d="M 0 0 C -25 25 -30 70 -65 65 C -85 45 -50 15 0 0 Z" fill="url(#petalLightBack)" stroke="#E8DAC7" stroke-width="0.8"/>
      <path d="M 0 0 C -60 -10 -90 -45 -70 -75 C -40 -70 -20 -35 0 0 Z" fill="url(#petalLightBack)" stroke="#E8DAC7" stroke-width="0.8"/>

      <path d="M -15 -10 C -25 -65 25 -75 35 -40 C 40 -15 10 5 -15 -10 Z" fill="url(#petalLightFront)" stroke="#EDE2D2" stroke-width="1"/>
      <path d="M 5 -15 C 35 -35 70 5 45 40 C 25 50 5 20 5 -15 Z" fill="url(#petalLightFront)" stroke="#EDE2D2" stroke-width="1"/>
      <path d="M -10 5 C 10 35 -10 65 -40 50 C -60 30 -35 -5 -10 5 Z" fill="url(#petalLightFront)" stroke="#EDE2D2" stroke-width="1"/>
      <path d="M -15 -15 C -45 -35 -65 5 -40 25 C -25 35 -5 5 -15 -15 Z" fill="url(#petalLightFront)" stroke="#EDE2D2" stroke-width="1"/>

      <circle cx="0" cy="0" r="14" fill="#7A5609"/>
      <circle cx="0" cy="0" r="11" fill="url(#goldLightMetallic)"/>
      <g fill="#FFF8CE" stroke="#A87A13" stroke-width="0.5">
        <circle cx="0" cy="-8" r="2.2"/><circle cx="5" cy="-6" r="2.2"/><circle cx="8" cy="-1" r="2.2"/>
        <circle cx="7" cy="4" r="2.2"/><circle cx="3" cy="8" r="2.2"/><circle cx="-3" cy="8" r="2.2"/>
        <circle cx="-7" cy="4" r="2.2"/><circle cx="-8" cy="-1" r="2.2"/><circle cx="-5" cy="-6" r="2.2"/>
        <circle cx="0" cy="0" r="2.2" fill="#FFEAA0"/>
      </g>
    </g>

    <!-- Twin Floating Hearts -->
    <g stroke="url(#goldLightMetallic)" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M 545 250 C 545 242 537 236 530 242 C 523 236 515 242 515 250 C 515 260 530 270 530 270 C 530 270 545 260 545 250 Z" transform="rotate(15 530 255)"/>
      <path d="M 552 280 C 552 273 545 268 539 273 C 533 268 526 273 526 280 C 526 289 539 298 539 298 C 539 298 552 289 552 280 Z" transform="rotate(22 539 285) scale(0.85) translate(80, -30)"/>
    </g>
  </g>

  <!-- "Amore" Wordmark -->
  <g id="amoreWordmarkLight" filter="url(#lightDropShadow)">
    <path d="M 175 255 
             C 145 272 108 275 88 252 
             C 72 232 78 198 108 162 
             C 142 122 195 95 240 135 
             C 265 158 255 198 238 235 
             L 175 350 
             C 165 370 148 375 138 368 
