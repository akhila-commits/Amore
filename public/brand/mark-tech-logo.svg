<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- MARK-TECH Official Brand Logo -->
  <defs>
    <linearGradient id="mtBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="mtFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Isometric Monogram MT -->
  <g id="mt-symbol" transform="translate(4, 2)">
    <!-- Left Pillar (M - White) -->
    <path d="M 6 24 L 20 24 L 20 74 L 6 74 Z" fill="#FFFFFF"/>
    
    <!-- Downward Diagonal Fold (M - Cool Grey Shading) -->
    <path d="M 20 24 L 38 46 L 38 60 L 20 38 Z" fill="url(#mtFacetGrad)"/>
    
    <!-- Upward Diagonal Fold (M - White) -->
    <path d="M 38 46 L 54 26 L 54 40 L 38 60 Z" fill="#FFFFFF"/>
    
    <!-- Slanted Crossbar (T - Electric Blue) -->
    <path d="M 34 32 L 76 10 L 76 22 L 34 44 Z" fill="url(#mtBlueGrad)"/>
    
    <!-- Right Pillar (T Stem - Electric Blue) -->
    <path d="M 58 24 L 72 17 L 72 74 L 58 74 Z" fill="#2563EB"/>
  </g>

  <!-- Typography: MARK-TECH -->
  <!-- "MARK" in White, "-TECH" in Electric Blue (#2563EB) -->
  <g id="mt-typography" transform="translate(92, 0)">
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="1.5">
      <tspan fill="#FFFFFF">MARK</tspan><tspan fill="#2563EB">-TECH</tspan>
    </text>
    <!-- Tagline: WHERE TECHNOLOGY MEETS GROWTH. -->
    <text x="1" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.8" fill="#94A3B8">
      WHERE TECHNOLOGY MEETS GROWTH.
    </text>
  </g>
</svg>
